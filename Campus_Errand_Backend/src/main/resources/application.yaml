spring:
  application:
    name: Campus_Errand_Backend

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/campus_errand
    username: root
    password: root

  data:
      redis:
        host: localhost
        port: 6379
        password:
        database: 0
        timeout: 3000ms

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 60MB

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true